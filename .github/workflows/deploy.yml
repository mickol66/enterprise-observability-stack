name: AWS CDK Enterprise Observability Deploy

on:
  push:
    branches:
      - main  # Pipelinen triggas vid push till main

permissions:
  id-token: write   # Krävs för säkert OIDC-handskak [2.1]
  contents: read    # Krävs för att klona koden

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Klona koden från ditt GitHub-repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sätt upp Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Sätt upp Node.js (Krävs för CDK)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Installera AWS CDK CLI globalt
      - name: Install AWS CDK
        run: npm install -g aws-cdk

      # 5. Installera Python-beroenden
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Autentisera mot AWS via OIDC [2.1]
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Hämtar ditt sparade ARN
          aws-region: eu-north-1
          audience: ://amazonaws.com

      # 7. Driftsätt din övervaknings-dashboard!
      - name: CDK Deploy
        run: cdk deploy --require-approval never
